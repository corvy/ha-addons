name: Update Beta Changelog

on:
  release:
    types: [published, prereleased]

permissions:
  contents: write

jobs:
  update-changelog-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main branch
        uses: actions/checkout@v6
        with:
          ref: main
          # Full history so the rebase before pushing has something to work with.
          fetch-depth: 0

      - name: Get latest release info
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput("release_body", context.payload.release.body || "");
            core.setOutput("release_tag", context.payload.release.tag_name);

      - name: Prepend release notes to gpsd2mqtt_beta/CHANGELOG.md
        env:
          # Passed through the environment rather than interpolated into the
          # script: release notes are free text and would otherwise be able to
          # inject shell commands here.
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_BODY: ${{ steps.release.outputs.release_body }}
        run: |
          set -euo pipefail
          FILE="gpsd2mqtt_beta/CHANGELOG.md"
          TMP="$(mktemp)"

          # Only the newest entry stays visible; everything else is folded into
          # one <details> block. The old wrapper lines are stripped and rewritten
          # each run rather than nested, so this is idempotent -- running it
          # twice does not produce <details> inside <details>. Entry text itself
          # is never rewritten or dropped.
          {
            echo "# Changelog"
            echo
            echo "## [${RELEASE_TAG}] - $(date -u +%Y-%m-%d)"
            printf '%s\n' "${RELEASE_BODY}"
            echo
            echo "<details>"
            echo "<summary>Older changes</summary>"
            echo
            awk '
              NR == 1 && /^# Changelog/           { next }
              /^<details>[[:space:]]*$/           { next }
              /^<summary>Older changes<\/summary>[[:space:]]*$/ { next }
              /^<\/details>[[:space:]]*$/         { next }
              # Drop leading blanks, otherwise one accumulates per release.
              !started && /^[[:space:]]*$/        { next }
              { started = 1; print }
            ' "$FILE"
            echo "</details>"
          } > "$TMP"

          mv "$TMP" "$FILE"

      - name: Commit and push changelog to main
        run: |
          set -euo pipefail
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add gpsd2mqtt_beta/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
            exit 0
          fi
          git commit -m "chore: update gpsd2mqtt_beta CHANGELOG.md from GitHub release"
          git pull --rebase origin main
          git push origin main
