name: Builder

env:
  BUILD_ARGS: "--test"
  MONITORED_FILES: "build.yaml config.yaml Dockerfile rootfs"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history so the diff below can reach the merge base.
          fetch-depth: 0

      - name: Get changed files
        id: changed_files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # Merge base, not the base tip: comparing to the tip would require
            # the PR head to be a strict descendant of base.
            base="$(git merge-base "${PR_BASE_SHA}" "${PR_HEAD_SHA}")"
            head="${PR_HEAD_SHA}"
          else
            base="${PUSH_BEFORE}"
            head="${PUSH_AFTER}"
            # All-zero means a new branch or force push: no previous state.
            if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="${head}^"
            fi
          fi

          echo "Comparing ${base}...${head}"
          git diff --name-only "${base}" "${head}" | tee /tmp/changed_files.txt

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Get changed add-ons
        id: changed_addons
        run: |
          set -euo pipefail

          declare -a changed_addons=()
          for addon in ${{ steps.addons.outputs.addons }}; do
            for file in ${{ env.MONITORED_FILES }}; do
              # Exact path match; the second grep covers rootfs, a directory.
              if grep -qxF "${addon}/${file}" /tmp/changed_files.txt \
                || grep -qF "${addon}/${file}/" /tmp/changed_files.txt; then
                changed_addons+=("${addon}")
                break
              fi
            done
          done

          if [[ ${#changed_addons[@]} -eq 0 ]]; then
            echo "No add-on had any monitored files changed (${{ env.MONITORED_FILES }})";
            exit 0
          fi

          echo "Changed add-ons: ${changed_addons[*]}";
          printf -v json '"%s",' "${changed_addons[@]}"
          echo "changed=true" >> $GITHUB_OUTPUT;
          echo "addons=[${json%,}]" >> $GITHUB_OUTPUT;
  build:
    needs: init
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
        # armhf, armv7 and i386 were dropped in Home Assistant 2025.12.
        arch: ["aarch64", "amd64"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Check if add-on should be built
        id: check
        run: |
          if [[ "${{ steps.info.outputs.architectures }}" =~ ${{ matrix.arch }} ]]; then
             echo "build_arch=true" >> $GITHUB_OUTPUT;
             echo "image=$(echo ${{ steps.info.outputs.image }} | cut -d'/' -f3)" >> $GITHUB_OUTPUT;
             if [[ -z "${{ github.head_ref }}" ]] && [[ "${{ github.event_name }}" == "push" ]]; then
                 echo "BUILD_ARGS=" >> $GITHUB_ENV;
             fi
           else
             echo "${{ matrix.arch }} is not a valid arch for ${{ matrix.addon }}, skipping build";
             echo "build_arch=false" >> $GITHUB_OUTPUT;
          fi

      - name: Login to GitHub Container Registry
        if: env.BUILD_ARGS != '--test'
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.addon }} add-on
        if: steps.check.outputs.build_arch == 'true'
        uses: home-assistant/builder@2026.03.2
        with:
          args: |
            ${{ env.BUILD_ARGS }} \
            --${{ matrix.arch }} \
            --target /data/${{ matrix.addon }} \
            --image "${{ steps.check.outputs.image }}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon
