name: Builder

env:
  MONITORED_FILES: "build.yaml config.yaml Dockerfile rootfs"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history so the diff below can reach the merge base.
          fetch-depth: 0

      - name: Get changed files
        id: changed_files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # Merge base, not the base tip: comparing to the tip would require
            # the PR head to be a strict descendant of base.
            base="$(git merge-base "${PR_BASE_SHA}" "${PR_HEAD_SHA}")"
            head="${PR_HEAD_SHA}"
          else
            base="${PUSH_BEFORE}"
            head="${PUSH_AFTER}"
            # All-zero means a new branch or force push: no previous state.
            if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="${head}^"
            fi
          fi

          echo "Comparing ${base}...${head}"
          git diff --name-only "${base}" "${head}" | tee /tmp/changed_files.txt

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Get changed add-ons
        id: changed_addons
        run: |
          set -euo pipefail

          declare -a changed_addons=()
          for addon in ${{ steps.addons.outputs.addons }}; do
            for file in ${{ env.MONITORED_FILES }}; do
              # Exact path match; the second grep covers rootfs, a directory.
              if grep -qxF "${addon}/${file}" /tmp/changed_files.txt \
                || grep -qF "${addon}/${file}/" /tmp/changed_files.txt; then
                changed_addons+=("${addon}")
                break
              fi
            done
          done

          if [[ ${#changed_addons[@]} -eq 0 ]]; then
            echo "No add-on had any monitored files changed (${{ env.MONITORED_FILES }})";
            exit 0
          fi

          echo "Changed add-ons: ${changed_addons[*]}";
          printf -v json '"%s",' "${changed_addons[@]}"
          echo "changed=true" >> $GITHUB_OUTPUT;
          echo "addons=[${json%,}]" >> $GITHUB_OUTPUT;
  build:
    needs: init
    # Native runner per arch, no QEMU.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing.
      id-token: write
    strategy:
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
        # armhf, armv7 and i386 were dropped in Home Assistant 2025.12.
        arch: ["aarch64", "amd64"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Check if add-on should be built
        id: check
        env:
          ADDON: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
          SUPPORTED: ${{ steps.info.outputs.architectures }}
          RAW_IMAGE: ${{ steps.info.outputs.image }}
          RAW_VERSION: ${{ steps.info.outputs.version }}
          RAW_NAME: ${{ steps.info.outputs.name }}
          RAW_DESCRIPTION: ${{ steps.info.outputs.description }}
          RAW_URL: ${{ steps.info.outputs.url }}
        run: |
          set -euo pipefail

          if [[ ! "${SUPPORTED}" =~ ${ARCH} ]]; then
            echo "${ARCH} is not a valid arch for ${ADDON}, skipping build"
            echo "build_arch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The info helper emits JSON scalars, so every value arrives quoted.
          # Strip that, and flatten the escaped newline in the description.
          clean() {
            local value="$1"
            value="${value#\"}"
            value="${value%\"}"
            printf '%s' "${value//\\n/ }"
          }

          image="$(clean "${RAW_IMAGE}")"

          {
            echo "build_arch=true"
            # Resolve the {arch} placeholder from config.yaml.
            echo "image=${image//\{arch\}/${ARCH}}"
            echo "version=$(clean "${RAW_VERSION}")"
            echo "name=$(clean "${RAW_NAME}")"
            echo "description=$(clean "${RAW_DESCRIPTION}")"
            echo "url=$(clean "${RAW_URL}")"
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.addon }} add-on
        if: steps.check.outputs.build_arch == 'true'
        # Generic action: it supplies BUILD_ARCH, BUILD_VERSION and the
        # io.hass.arch/version labels, the add-on metadata below is on us.
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: ./${{ matrix.addon }}
          image: ${{ steps.check.outputs.image }}
          # latest is what build-image verifies and reuses as its registry cache.
          image-tags: |
            ${{ steps.check.outputs.version }}
            latest
          version: ${{ steps.check.outputs.version }}
          # PRs verify only, merges to main publish.
          push: ${{ github.event_name == 'push' }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
          labels: |
            io.hass.name=${{ steps.check.outputs.name }}
            io.hass.description=${{ steps.check.outputs.description }}
            io.hass.type=addon
            io.hass.url=${{ steps.check.outputs.url }}
